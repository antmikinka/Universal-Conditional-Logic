name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: UCL_LINTER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UCL_LINTER/pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Check installed modules import
        working-directory: ${{ runner.temp }}
        run: python -c "import core, domains, builder, prompt_analyzer, ucl_demo, tool_domains, tool_comparison, tool_export"

      - name: Run tests
        run: python -m pytest -q
