name: Deploy UCL Builder

on:
  push:
    branches: ["local/ucl-builder-full"]
    paths:
      - "UCL_LINTER/ucl-builder/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload builder
        uses: actions/upload-pages-artifact@v3
        with:
          path: UCL_LINTER/ucl-builder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
